name: Publish Crate

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump: none publishes the version Cargo.toml already has, custom sets `version`"
        required: true
        type: choice
        default: none
        options:
          - none
          - custom
          - patch
          - minor
          - major
      version:
        description: "The version to set when version_bump is custom, e.g. 0.5.0-alpha.2"
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GA_TOKEN }}
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-workspaces
        if: inputs.version_bump != 'none'
        run: cargo install cargo-workspaces

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions[bot]@github.com"

      - name: Bump version
        if: inputs.version_bump != 'none'
        env:
          BUMP: ${{ inputs.version_bump }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$BUMP" = custom ]; then
            test -n "$VERSION" || { echo "version_bump=custom needs the version input"; exit 1; }
            cargo workspaces version custom "$VERSION" --no-git-commit --yes
          else
            cargo workspaces version "$BUMP" --no-git-commit --yes
          fi

      - name: Commit version bump
        if: inputs.version_bump != 'none'
        run: |
          git add .
          git diff --cached --quiet || {
            git commit -m "chore: bump crate version (${{ inputs.version_bump }})"
            git push
          }

      - name: Configure cargo for publishing
        run: |
          mkdir -p ~/.cargo
          echo "[net]" >> ~/.cargo/config.toml
          echo "git-fetch-with-cli = true" >> ~/.cargo/config.toml

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --allow-dirty

      - name: Tag the published version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cjseq") | .version')
          git tag "$version"
          git push origin "$version"
