name: Publish NPM Package

on: workflow_dispatch

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GA_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: |
          wasm-pack build --target web --scope cityjson -- --no-default-features --features wasm

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # A pre-release such as 0.5.0-alpha.1 goes under its own dist-tag
        # (`alpha`), so `npm install @cityjson/cjseq` keeps giving the latest
        # release.
        run: |
          cd pkg
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) tag=${version#*-}; tag=${tag%%.*} ;;
            *) tag=latest ;;
          esac
          echo "publishing $version under dist-tag $tag"
          npm publish --access public --tag "$tag"
